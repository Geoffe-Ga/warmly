name: Release Policy

# Fails a pull request that removes a required check, deletes a file of a
# required suite or weakens a threshold, unless a person has put the
# `release-policy-change` label on it (PRD §10, REL-002; AC-24).
#
# It runs again when a label is added or removed, so the label takes
# effect without a new commit.

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  guard:
    name: Release Policy Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: head
          persist-credentials: false

      - name: Checkout what it would merge into
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install the guard's one dependency
        run: python -m pip install PyYAML==6.0.4

      - name: Fetch who labelled the pull request
        run: |
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/events?per_page=100" \
            > label-events.json
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}

      - name: Compare the pull request with its base
        # The guard that runs is the base's own copy when the base has one,
        # so a pull request cannot pass by editing the guard.
        run: |
          if [ -f base/scripts/release/policy.py ]; then
            cd base
            python -m scripts.release.policy --base . --head ../head --events ../label-events.json
          else
            cd head
            python -m scripts.release.policy --base ../base --head . --events ../label-events.json
          fi
