name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      run_mutation:
        description: 'Run optional mutation testing (release-time quality report)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    # A throwaway PostgreSQL for the integration tests. It accepts local
    # connections without a password, so no credential is configured here.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: warmly_admin
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warmly_admin"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      WARMLY_TEST_DATABASE_URL: postgresql://warmly_admin@127.0.0.1:5432/postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements*.txt
            **/requirements*.txt
            pyproject.toml
            setup.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-cov pytest-xdist ruff pylint mypy bandit pip-audit interrogate

      - name: Check code formatting with Ruff
        run: ruff format --check .

      - name: Lint with Ruff
        run: ruff check . --output-format=github

      - name: Lint with Pylint
        run: |
          pylint --recursive=y --output-format=colorized . || true
          pylint --recursive=y --fail-under=8.0 .
        continue-on-error: false

      - name: Type check with mypy
        run: mypy . --install-types --non-interactive --show-error-codes --pretty
        continue-on-error: false

      - name: Check layering with import-linter
        run: lint-imports --config plans/architecture/.importlinter

      - name: Check the OpenAPI contract is up to date
        run: ./scripts/python/contract.sh --check

      - name: Check docstring coverage
        run: |
          interrogate -vv --fail-under=95 --ignore-init-method --ignore-init-module .

      - name: Run security scan with Bandit
        run: bandit -r . -f json -o bandit-report.json || true

      - name: Check Bandit results
        run: |
          if [ -f bandit-report.json ]; then
            HIGH_SEVERITY=$(jq '[.results[] | select(.issue_severity == "HIGH" or .issue_severity == "CRITICAL")] | length' bandit-report.json)
            if [ "$HIGH_SEVERITY" -gt 0 ]; then
              echo "Found $HIGH_SEVERITY critical/high severity issues"
              bandit -r . -f screen
              exit 1
            fi
          fi

      - name: Audit dependencies with pip-audit
        run: pip-audit --desc --require-hashes --disable-pip || pip-audit --desc

      - name: Run tests with coverage
        run: |
          pytest -v \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-branch \
            --cov-fail-under=90 \
            --junitxml=pytest-report.xml \
            -n auto
        env:
          COVERAGE_FILE: .coverage.${{ matrix.python-version }}

      - name: Check branch coverage
        run: |
          BRANCH_COVERAGE=$(python -c "import xml.etree.ElementTree as ET; tree=ET.parse('coverage.xml'); root=tree.getroot(); print(root.attrib.get('branch-rate', '0'))")
          BRANCH_PERCENT=$(python -c "print(float('$BRANCH_COVERAGE') * 100)")
          echo "Branch coverage: ${BRANCH_PERCENT}%"
          if (( $(echo "$BRANCH_PERCENT < 85" | bc -l) )); then
            echo "Branch coverage ${BRANCH_PERCENT}% is below minimum 85%"
            exit 1
          fi

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
            .coverage.${{ matrix.python-version }}
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            pytest-report.xml
            bandit-report.json
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: python-${{ matrix.python-version }}
          name: codecov-${{ matrix.python-version }}
          fail_ci_if_error: false

  frontend:
    name: Frontend Quality (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npx eslint . --max-warnings=0

      - name: Check formatting with Prettier
        run: ./scripts/typescript/format.sh --check

      - name: Type check
        run: npm run type-check

      - name: Check generated API types are up to date
        run: ./scripts/typescript/contract.sh --check

      - name: Unit tests with coverage (Vitest)
        run: npx vitest run --coverage

      - name: Production build (PWA)
        run: npx vite build

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 30

  e2e:
    name: E2E + Accessibility (Playwright, axe-core)
    runs-on: ubuntu-latest
    needs: frontend
    # The suite usually takes about five minutes and has taken 23 on a
    # slow runner. A run that truly hangs is stopped, so that it fails and
    # can be read, and does not sit for the default six hours.
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run E2E and accessibility tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  mutation-testing:
    # Optional, release-time only: never runs on ordinary pushes/PRs and never
    # blocks a release. Runs when a GitHub Release is published, or manually via
    # workflow_dispatch with run_mutation=true. The score is reported, not enforced.
    name: Mutation Testing (optional, release-time)
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.run_mutation)
    needs: quality
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install mutmut pytest pytest-cov

      - name: Run mutation testing
        run: |
          mutmut run --paths-to-mutate=. --tests-dir=tests || true
          mutmut results
          mutmut junitxml > mutmut-report.xml

      - name: Check mutation score
        run: |
          MUTATION_SCORE=$(mutmut results | grep -oP 'survived: \K\d+' | head -1 || echo "0")
          TOTAL_MUTANTS=$(mutmut results | grep -oP 'total: \K\d+' | head -1 || echo "1")
          KILL_RATE=$(python -c "print(100 - ($MUTATION_SCORE / $TOTAL_MUTANTS * 100))")
          echo "Mutation kill rate: ${KILL_RATE}%"
          if (( $(echo "$KILL_RATE < 80" | bc -l) )); then
            echo "::warning::Mutation score ${KILL_RATE}% is below the 80% target (advisory only)"
          fi

      - name: Upload mutation test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-test-results
          path: mutmut-report.xml
          retention-days: 30

  mutation-testing-typescript:
    # Optional, release-time only; advisory (see mutation-testing above).
    name: Mutation Testing - TypeScript (optional, release-time)
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.run_mutation)
    needs: frontend
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Stryker (advisory)
        run: |
          npx stryker run || echo "::warning::TypeScript mutation score is below the 80% target (advisory only)"

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report-typescript
          path: reports/mutation/
          retention-days: 30

  complexity-analysis:
    name: Complexity Analysis
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install tools
        run: |
          pip install radon xenon

      - name: Analyze cyclomatic complexity
        run: |
          radon cc . -a -s --total-average

      - name: Analyze maintainability index
        run: |
          radon mi . -s

      - name: Check complexity thresholds
        run: |
          xenon --max-absolute B --max-modules A --max-average A . || true

      - name: Generate complexity report
        run: |
          radon cc . -a -s --json > complexity-report.json
          radon mi . -s --json > maintainability-report.json

      - name: Upload complexity reports
        uses: actions/upload-artifact@v4
        with:
          name: complexity-reports
          path: |
            complexity-report.json
            maintainability-report.json
          retention-days: 30

  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel build twine

      - name: Build package
        run: |
          python -m build

      - name: Check distribution
        run: |
          twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 30
