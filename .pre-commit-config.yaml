default_language_version:
  python: python3.11
ci:
  autofix_commit_msg: 'style: auto-fix by pre-commit hooks'
  autoupdate_commit_msg: 'chore: update pre-commit hooks'
  skip: []
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.5.0
  hooks:
  # The two Claude workflow files are installed and validated by the Claude
  # GitHub app, which refuses to run on a pull request that edits them, so
  # whitespace fixes to them must be committed to main directly.
  - id: trailing-whitespace
    # Two trailing spaces are a hard line break in Markdown; keep them.
    args: [--markdown-linebreak-ext=md]
    exclude: ^\.github/workflows/(claude|code-review)\.yml$
  - id: end-of-file-fixer
    exclude: ^\.github/workflows/(claude|code-review)\.yml$
  - id: check-yaml
  - id: check-toml
  - id: check-json
  - id: check-added-large-files
    args:
    - --maxkb=500
  - id: check-case-conflict
  - id: check-merge-conflict
  - id: check-symlinks
  - id: check-ast
  - id: debug-statements
  - id: check-docstring-first
  - id: detect-private-key
  - id: fix-byte-order-marker
  - id: mixed-line-ending
    args:
    - --fix=lf
  - id: no-commit-to-branch
    args:
    - --branch
    - main
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Keep in step with the ruff pin in requirements-dev.txt.
  rev: v0.17.6
  hooks:
  - id: ruff
    args:
    - --fix
  - id: ruff-format
- repo: https://github.com/pre-commit/mirrors-mypy
  # Kept at the mypy version the local gate and CI install, so all three
  # agree. An older hook cannot read type-variable defaults in Starlette.
  rev: v2.4.1
  hooks:
  - id: mypy
    args:
    - --strict
    # The hook runs in its own environment, so every package the checked code
    # imports must be listed here as well as in the requirements files.
    additional_dependencies:
    - pytest>=7.4.0
    - fastapi==0.165.0
    - starlette==1.10.0
    - pydantic==2.14.4
    - uvicorn==0.54.0
    - httpx2>=2.16.0
    - psycopg==3.3.9
    - psycopg-pool==3.3.3
    - pyjwt==2.15.1
    - cryptography==50.0.2
    - pytest-asyncio>=0.21.0
- repo: https://github.com/PyCQA/bandit
  rev: 1.7.7
  hooks:
  - id: bandit
    args:
    - -c
    - pyproject.toml
    additional_dependencies:
    - bandit[toml]
- repo: https://github.com/pypa/pip-audit
  rev: v2.7.3
  hooks:
  - id: pip-audit
- repo: https://github.com/compilerla/conventional-pre-commit
  rev: v3.0.0
  hooks:
  - id: conventional-pre-commit
    stages:
    - commit-msg
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.9.0.6
  hooks:
  - id: shellcheck
- repo: https://github.com/asottile/pyupgrade
  rev: v3.21.2
  hooks:
  - id: pyupgrade
    args:
    - --py311-plus
- repo: https://github.com/PyCQA/autoflake
  rev: v2.2.1
  hooks:
  - id: autoflake
    args:
    - --in-place
    - --remove-all-unused-imports
    - --remove-unused-variables
    - --remove-duplicate-keys
    - --ignore-init-module-imports
- repo: https://github.com/guilatrova/tryceratops
  rev: v2.3.2
  hooks:
  - id: tryceratops
- repo: https://github.com/dosisod/refurb
  rev: v2.3.1
  hooks:
  - id: refurb
- repo: https://github.com/jendrikseipp/vulture
  rev: v2.10
  hooks:
  - id: vulture
    args:
    - warmly/
    - --min-confidence
    - '80'
- repo: https://github.com/Yelp/detect-secrets
  rev: v1.4.0
  hooks:
  - id: detect-secrets
    args:
    - --baseline
    - .secrets.baseline
- repo: https://github.com/pre-commit/mirrors-prettier
  rev: v4.0.0-alpha.8
  hooks:
  - id: prettier
    types_or:
    - ts
    - tsx
    - javascript
    - json
